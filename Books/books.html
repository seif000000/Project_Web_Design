<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-key="booksPage.books">الكتب</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .books-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem 5%;
      }
      .page-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .page-header h1 {
        font-size: 2.5rem;
        color: var(--page-title-color);
        margin-bottom: 1rem;
      }
      .search-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .search-input {
        padding: 0.75rem 1rem;
        border: 1px solid var(--muted);
        border-radius: 8px;
        font-size: 1rem;
        background: var(--card-bg);
        color: var(--text-color);
        min-width: 300px;
        flex: 1;
        max-width: 600px;
      }
      .search-btn {
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: var(--dark);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      .search-btn:hover {
        background: var(--accent-hover);
      }
      .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .book-item {
        background: var(--card-bg);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }
      .book-item:hover {
        transform: translateY(-5px);
      }
      .book-cover {
        width: 100%;
        height: 280px;
        object-fit: cover;
        background: #f0f0f0;
      }
      .book-info {
        padding: 1rem;
      }
      .book-title {
        font-weight: bold;
        font-size: 1.1rem;
        margin: 0.5rem 0;
        color: var(--text-color);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .book-author {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .book-price {
        font-weight: bold;
        color: var(--accent);
        font-size: 1.2rem;
      }
      .book-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 0.75rem;
      }
      .btn-sm {
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        flex: 1;
        margin-right: 0.25rem;
      }
      .btn-view {
        background: #e0e0e0;
        color: var(--text-dark);
      }
      .btn-add {
        background: var(--accent);
        color: var(--dark);
      }
      .pagination {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 2rem;
      }
      .page-btn {
        padding: 0.5rem 1rem;
        background: var(--card-bg);
        border: 1px solid var(--muted);
        color: var(--text-color);
        cursor: pointer;
        border-radius: 5px;
      }
      .page-btn.active {
        background: var(--accent);
        color: var(--dark);
        font-weight: bold;
      }
      .page-btn:hover:not(.active) {
        background: #f0f0f0;
      }
      .no-results {
        text-align: center;
        padding: 3rem;
        grid-column: 1 / -1;
        color: var(--muted);
      }
      .dark-mode .search-input {
        border-color: #555;
      }
      @media (max-width: 768px) {
        .search-controls {
          flex-direction: column;
        }
        .search-input {
          min-width: auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="../index.html" class="logo-icon">📚</a>
        <span id="site-name">Book Worms</span>
      </div>
      <div class="nav-section nav-center">
        <a href="../contact/contact.html" class="nav-link">اتصل بنا</a>
        <a href="../about/about-us.html" class="nav-link">من نحن</a>
        <a href="books.html" class="nav-link active">جميع الكتب</a>
      </div>
      <div class="nav-section nav-right">
        <button id="language-toggle-btn" class="nav-icon-btn lang-btn">
          AR
        </button>
        <button
          id="theme-toggle"
          class="nav-icon-btn"
          aria-label="Toggle dark mode"
        >
          <span id="sun-icon">☀️</span>
          <span id="moon-icon" style="display: none">🌙</span>
        </button>
        <a href="../Checkout/checkout.html" class="nav-cart-link">
          <button class="nav-icon-btn nav-cart-btn">
            <span class="cart-emoji">🛒</span>
            <span class="cart-count" id="cart-count">0</span>
          </button>
        </a>
        <a href="../personal/register.html" class="user-icon">👤</a>
      </div>
    </nav>

    <div class="books-container">
      <div class="page-header">
        <h1 id="page-title">جميع الكتب</h1>
        <p id="search-hint">ابحث عن كتاب (العنوان، المؤلف، الفئة)</p>
      </div>

      <div class="search-controls">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="ابحث عن كتاب..."
        />
        <button id="search-btn" class="search-btn">بحث</button>
      </div>

      <div class="books-grid" id="books-grid">
        <div class="no-results" id="loading">جارٍ التحميل...</div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-column">
          <div class="footer-logo">
            <span id="footer-site-name">Book Worms</span>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p id="copyright">حقوق النشر © 2025 Book Worms</p>
      </div>
    </footer>

    <script>
      // ================================
      // Books Page — Fully Fixed Version
      // ================================

      const API_BASE = "/api/books";
      let currentLang = localStorage.getItem("language") || "ar";
      let allBooks = [];
      let filteredBooks = [];
      const booksPerPage = 12;
      let currentPage = 1;

      // DOM elements
      const searchInput = document.getElementById("search-input");
      const searchBtn = document.getElementById("search-btn");
      const booksGrid = document.getElementById("books-grid");
      const paginationEl = document.getElementById("pagination");
      const cartCountEl = document.getElementById("cart-count");

      // Translations
      const translations = {
        ar: {
          siteName: "Book Worms",
          pageTitle: "جميع الكتب",
          searchHint: "ابحث عن كتاب (العنوان، المؤلف، الفئة)",
          searchBtn: "بحث",
          loading: "جارٍ التحميل...",
          noResults: "لا توجد نتائج",
          author: "المؤلف:",
          details: "التفاصيل",
          add: "+",
          copyright: "حقوق النشر © 2025 Book Worms",
        },
        en: {
          siteName: "Book Worms",
          pageTitle: "All Books",
          searchHint: "Search by title, author, category",
          searchBtn: "Search",
          loading: "Loading...",
          noResults: "No results",
          author: "Author:",
          details: "Details",
          add: "+",
          copyright: "Copyright © 2025 Book Worms",
        },
      };

      function t(key) {
        return translations[currentLang][key] || key;
      }

      function applyTranslations() {
        document.getElementById("site-name").textContent = t("siteName");
        document.getElementById("page-title").textContent = t("pageTitle");
        document.getElementById("search-hint").textContent = t("searchHint");
        if (searchInput) searchInput.placeholder = t("searchHint");
        if (searchBtn) searchBtn.textContent = t("searchBtn");
        document.getElementById("footer-site-name").textContent = t("siteName");
        document.getElementById("copyright").textContent = t("copyright");
      }

      // Helper: Get localized string safely
      function getLocalized(obj, fallback = "---") {
        if (!obj) return fallback;
        if (typeof obj === "string") return obj;
        if (obj[currentLang]) return obj[currentLang];
        if (obj.ar) return obj.ar;
        if (obj.en) return obj.en;
        return fallback;
      }

      // Helper: Get auth token
      function getAuthToken() {
        return localStorage.getItem("token");
      }

      // Load all books (no pagination on backend)
      async function loadBooks() {
        try {
          booksGrid.innerHTML = `<div class="no-results">${t("loading")}</div>`;
          // Fetch all books (limit=100 is safe for dev)
          const res = await fetch(`${API_BASE}?limit=100`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          // Handle both array and paginated response
          if (Array.isArray(data)) {
            allBooks = data;
          } else if (data.books && Array.isArray(data.books)) {
            allBooks = data.books;
          } else {
            throw new Error("Unexpected API response");
          }

          filteredBooks = [...allBooks];
          currentPage = 1;
          renderBooks();
          renderPagination();
        } catch (err) {
          console.error("❌ Load books error:", err);
          booksGrid.innerHTML = `<div class="no-results">${t("noResults")}</div>`;
          if (paginationEl) paginationEl.innerHTML = "";
        }
      }

      // Filter books (client-side)
      function filterBooks(query) {
        if (!query.trim()) {
          filteredBooks = [...allBooks];
        } else {
          const q = query.trim().toLowerCase();
          filteredBooks = allBooks.filter(
            (book) =>
              getLocalized(book.title, "").toLowerCase().includes(q) ||
              getLocalized(book.author, "").toLowerCase().includes(q) ||
              getLocalized(book.category, "").toLowerCase().includes(q),
          );
        }
        currentPage = 1; // Reset to first page on search
        renderBooks();
        renderPagination();
      }

      // Render current page of books
      function renderBooks() {
        const start = (currentPage - 1) * booksPerPage;
        const pageBooks = filteredBooks.slice(start, start + booksPerPage);

        if (pageBooks.length === 0) {
          booksGrid.innerHTML = `<div class="no-results">${t("noResults")}</div>`;
          return;
        }

        booksGrid.innerHTML = pageBooks
          .map((book) => {
            const title = getLocalized(book.title);
            const author = getLocalized(book.author);
            const cover =
              book.image_url || book.cover || "../image/placeholder-book.webp";
            const safeTitle = title.replace(/`/g, "\\`").replace(/\$/g, "\\$");

            return `
            <div class="book-item">
              <img src="${cover}" 
                   alt="${title}"
                   class="book-cover"
                   onerror="this.src='../image/placeholder-book.webp'">
              <div class="book-info">
                <h3 class="book-title">${title}</h3>
                <div class="book-author">${t("author")} ${author}</div>
                <div class="book-price">${book.price ? book.price + " ج.م" : "---"}</div>
                <div class="book-actions">
                  <button class="btn-sm btn-view" 
                          onclick="location.href='details.html?id=${book._id}'">
                    ${t("details")}
                  </button>
                  <button class="btn-sm btn-add" 
                          onclick="addToCart('${book._id}', \`${safeTitle}\`, ${book.price || 0})">
                    ${t("add")}
                  </button>
                </div>
              </div>
            </div>
          `;
          })
          .join("");
      }

      // Render pagination controls
      function renderPagination() {
        if (!paginationEl) return;

        const totalPages = Math.ceil(filteredBooks.length / booksPerPage);
        if (totalPages <= 1) {
          paginationEl.innerHTML = "";
          return;
        }

        const pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          pages.push(1);
          if (currentPage > 4) pages.push("...");
          const start = Math.max(2, currentPage - 2);
          const end = Math.min(totalPages - 1, currentPage + 2);
          for (let i = start; i <= end; i++) pages.push(i);
          if (currentPage < totalPages - 3) pages.push("...");
          pages.push(totalPages);
        }

        paginationEl.innerHTML = pages
          .map((p) =>
            p === "..."
              ? `<span class="page-btn">...</span>`
              : `<button class="page-btn ${p === currentPage ? "active" : ""}" 
                       onclick="goToPage(${p})">${p}</button>`,
          )
          .join("");
      }

      // Navigation
      window.goToPage = function (page) {
        const totalPages = Math.ceil(filteredBooks.length / booksPerPage);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderBooks();
        renderPagination();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      // Search handling
      if (searchBtn) {
        searchBtn.addEventListener("click", () => {
          filterBooks(searchInput.value);
        });
      }
      if (searchInput) {
        searchInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") filterBooks(searchInput.value);
        });
      }

      // Cart functionality
      window.addToCart = async function (id, title, price) {
        const token = getAuthToken();
        const item = { bookId: id, title, price, quantity: 1 };

        try {
          const res = await fetch("/api/cart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...item, token }),
          });

          if (res.ok) {
            updateCartCount();
            // Visual feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = "✓";
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1000);
          }
        } catch (err) {
          console.error("❌ Add to cart failed:", err);
          // Fallback to localStorage
          let cart = JSON.parse(localStorage.getItem("cart")) || [];
          const existing = cart.find((x) => x.id === id);
          if (existing) {
            existing.quantity = (existing.quantity || 1) + 1;
          } else {
            cart.push({ id, title, price, quantity: 1 });
          }
          localStorage.setItem("cart", JSON.stringify(cart));
          updateCartCount();
        }
      };

      function updateCartCount() {
        if (!cartCountEl) return;
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
        cartCountEl.textContent = count;
      }

      // Theme toggle
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          document.body.classList.toggle("dark-mode");
          const isDark = document.body.classList.contains("dark-mode");
          document.getElementById("sun-icon").style.display = isDark
            ? "none"
            : "inline";
          document.getElementById("moon-icon").style.display = isDark
            ? "inline"
            : "none";
          localStorage.setItem("theme", isDark ? "dark" : "light");
        });
      }

      // Language toggle
      const langToggle = document.getElementById("language-toggle-btn");
      if (langToggle) {
        langToggle.addEventListener("click", () => {
          currentLang = currentLang === "ar" ? "en" : "ar";
          localStorage.setItem("language", currentLang);
          document.documentElement.lang = currentLang;
          document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
          langToggle.textContent = currentLang.toUpperCase();
          applyTranslations();
          renderBooks();
          renderPagination();
        });
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        // Apply theme
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
          document.getElementById("sun-icon").style.display = "none";
          document.getElementById("moon-icon").style.display = "inline";
        }

        // Apply language
        if (localStorage.getItem("language") === "en") {
          currentLang = "en";
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
          if (langToggle) langToggle.textContent = "EN";
        }

        applyTranslations();
        updateCartCount();
        loadBooks(); // Load books on init
      });
    </script>
  </body>
</html>
