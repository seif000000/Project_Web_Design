<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل الكتاب - Book Worms</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .details-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 5%;
      }
      .book-header {
        display: flex;
        gap: 2rem;
        margin-bottom: 2rem;
        align-items: flex-start;
      }
      .book-cover-large {
        width: 300px;
        height: 450px;
        object-fit: cover;
        border-radius: 10px;
      }
      .book-info {
        flex: 1;
      }
      .book-title {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .book-author {
        font-size: 1.2rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      .book-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .meta-item {
        display: flex;
        flex-direction: column;
      }
      .meta-label {
        font-weight: bold;
      }
      .book-price {
        font-size: 2rem;
        color: var(--accent);
        font-weight: bold;
        margin: 1rem 0;
      }
      .book-actions {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--dark);
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
      }

      /* PDF Viewer */
      .pdf-preview {
        margin: 2rem 0;
      }
      .pdf-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .pdf-title {
        font-size: 1.5rem;
      }
      .pdf-controls {
        display: flex;
        gap: 0.5rem;
      }
      .pdf-btn {
        padding: 0.5rem 1rem;
        background: var(--card-bg);
        border: 1px solid var(--muted);
        cursor: pointer;
      }
      .pdf-container {
        width: 100%;
        height: 500px;
        overflow: auto;
        border: 1px solid var(--muted);
        background: #f9f9f9;
      }
      #pdf-canvas {
        display: block;
        margin: 0 auto;
      }

      .book-description {
        margin-top: 2rem;
      }
      .description-title {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      .description-text {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="../index.html" class="logo-icon">📚</a>
        <span id="site-name">Book Worms</span>
      </div>
      <div class="nav-section nav-center">
        <a href="books.html" class="nav-link">جميع الكتب</a>
        <a href="../contact/contact.html" class="nav-link">اتصل بنا</a>
        <a href="../about/about-us.html" class="nav-link">من نحن</a>
      </div>
      <div class="nav-section nav-right">
        <button id="language-toggle-btn" class="nav-icon-btn lang-btn">
          AR
        </button>
        <button id="theme-toggle" class="nav-icon-btn">
          <span id="sun-icon">☀️</span>
          <span id="moon-icon" style="display: none">🌙</span>
        </button>
        <a href="../Checkout/checkout.html" class="nav-cart-link">
          <button class="nav-icon-btn nav-cart-btn">
            <span class="cart-emoji">🛒</span>
            <span class="cart-count" id="cart-count">0</span>
          </button>
        </a>
        <a href="../personal/register.html" class="user-icon">👤</a>
      </div>
    </nav>

    <div class="details-container">
      <div id="error-container" style="display: none">
        <div class="no-results" id="error-message">فشل تحميل الكتاب</div>
      </div>

      <div id="book-content" style="display: none">
        <div class="book-header">
          <img
            id="cover"
            class="book-cover-large"
            src="../image/placeholder-book.webp"
            onerror="this.src = '../image/placeholder-book.webp'"
          />
          <div class="book-info">
            <h1 id="title" class="book-title">---</h1>
            <div id="author" class="book-author">---</div>

            <div class="book-meta">
              <div class="meta-item">
                <span class="meta-label">الفئة</span>
                <span id="category">---</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">عدد الصفحات</span>
                <span id="pages">---</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">التقييم</span>
                <span id="rating">---</span>
              </div>
            </div>

            <div id="stock-status"></div>
            <div id="price" class="book-price">--- ج.م</div>

            <div class="book-actions">
              <button id="add-to-cart" class="btn btn-primary">
                إضافة إلى السلة
              </button>
              <button id="preview-btn" class="btn btn-outline">
                معاينة الكتاب
              </button>
            </div>
          </div>
        </div>

        <!-- PDF Preview Section -->
        <div class="pdf-preview" id="pdf-preview" style="display: none">
          <div class="pdf-header">
            <h2 class="pdf-title">معاينة الكتاب</h2>
            <div class="pdf-controls">
              <button id="prev-page" class="pdf-btn">الصفحة السابقة</button>
              <span id="page-num">1 / 1</span>
              <button id="next-page" class="pdf-btn">الصفحة التالية</button>
              <button id="close-preview" class="pdf-btn">إغلاق</button>
            </div>
          </div>
          <div class="pdf-container">
            <canvas id="pdf-canvas"></canvas>
          </div>
        </div>

        <div class="book-description">
          <h2 class="description-title">وصف الكتاب</h2>
          <div id="description" class="description-text">لا يوجد وصف متاح.</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-column">
          <div class="footer-logo">
            <span id="footer-site-name">Book Worms</span>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p id="copyright">حقوق النشر © 2025 Book Worms</p>
      </div>
    </footer>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      // Set worker
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

      let currentLang = localStorage.getItem("language") || "ar";
      let currentBook = null;
      let pdfDoc = null;
      let pageNum = 1;
      let pageRendering = false;
      let pageNumPending = null;
      const scale = 1.5;
      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d");

      // Translations
      const translations = {
        ar: {
          siteName: "Book Worms",
          loading: "جارٍ التحميل...",
          notFound: "الكتاب غير موجود",
          failedFetch: "فشل تحميل الكتاب",
          addToCart: "إضافة إلى السلة",
          preview: "معاينة الكتاب",
          close: "إغلاق",
          prev: "الصفحة السابقة",
          next: "الصفحة التالية",
          price: "ج.م",
          inStock: "متوفر",
          outOfStock: "نفدت الكمية",
          pages: "صفحات",
          rating: "تقييم",
          category: "الفئة",
          description: "وصف الكتاب",
          copyright: "حقوق النشر © 2025 Book Worms",
        },
        en: {
          siteName: "Book Worms",
          loading: "Loading...",
          notFound: "Book not found",
          failedFetch: "Failed to load book",
          addToCart: "Add to Cart",
          preview: "Preview Book",
          close: "Close",
          prev: "Previous Page",
          next: "Next Page",
          price: "EGP",
          inStock: "In Stock",
          outOfStock: "Out of Stock",
          pages: "Pages",
          rating: "Rating",
          category: "Category",
          description: "Book Description",
          copyright: "Copyright © 2025 Book Worms",
        },
      };

      function t(key) {
        return translations[currentLang][key] || key;
      }

      function applyTranslations() {
        document.getElementById("site-name").textContent = t("siteName");
        document.getElementById("footer-site-name").textContent = t("siteName");
        document.getElementById("copyright").textContent = t("copyright");
        if (document.getElementById("add-to-cart"))
          document.getElementById("add-to-cart").textContent = t("addToCart");
        if (document.getElementById("preview-btn"))
          document.getElementById("preview-btn").textContent = t("preview");
        if (document.getElementById("close-preview"))
          document.getElementById("close-preview").textContent = t("close");
        if (document.getElementById("prev-page"))
          document.getElementById("prev-page").textContent = t("prev");
        if (document.getElementById("next-page"))
          document.getElementById("next-page").textContent = t("next");
      }

      // Get localized field
      function getLocalized(obj, fallback = "---") {
        if (!obj) return fallback;
        if (typeof obj === "string") return obj;
        if (obj[currentLang]) return obj[currentLang];
        if (obj.ar) return obj.ar;
        if (obj.en) return obj.en;
        return fallback;
      }

      // Load book
      async function loadBook() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");
        if (!id) return showError(t("notFound"));

        try {
          document.getElementById("book-content").style.display = "none";
          document.getElementById("error-container").style.display = "none";

          const res = await fetch(`/api/books/${id}`);
          if (res.status === 404) return showError(t("notFound"));
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          currentBook = data.book || data;
          renderBook();
        } catch (err) {
          console.error("❌ Load book error:", err);
          showError(t("failedFetch"));
        }
      }

      // Render book
      function renderBook() {
        const book = currentBook;

        // Update DOM
        document.getElementById("title").textContent = getLocalized(book.title);
        document.getElementById("author").textContent =
          `المؤلف: ${getLocalized(book.author)}`;
        document.getElementById("category").textContent = getLocalized(
          book.category,
        );
        document.getElementById("pages").textContent = book.numberOfPages
          ? `${book.numberOfPages} ${t("pages")}`
          : "---";
        document.getElementById("rating").textContent = book.rating
          ? `${book.rating} ★`
          : "---";
        document.getElementById("price").textContent =
          `${book.price} ${t("price")}`;
        document.getElementById("description").textContent =
          book.description || t("noDescription");
        document.getElementById("cover").src =
          book.image_url || book.cover || "../image/placeholder-book.webp";

        // Stock status
        const stockEl = document.getElementById("stock-status");
        if (book.stock > 0) {
          stockEl.innerHTML = `<span style="color:green;">${t("inStock")} (${book.stock})</span>`;
        } else {
          stockEl.innerHTML = `<span style="color:red;">${t("outOfStock")}</span>`;
        }

        // Show content
        document.getElementById("book-content").style.display = "block";

        // Update cart count
        updateCartCount();
      }

      // Show error
      function showError(message) {
        document.getElementById("error-message").textContent = message;
        document.getElementById("error-container").style.display = "block";
        document.getElementById("book-content").style.display = "none";
      }

      // Add to cart
      async function addToCart() {
        if (!currentBook) return;

        const token = localStorage.getItem("token");
        const item = {
          bookId: currentBook._id,
          title: getLocalized(currentBook.title),
          price: currentBook.price,
          quantity: 1,
        };

        try {
          const res = await fetch("/api/cart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...item, token }),
          });

          if (res.ok) {
            updateCartCount();
            // Visual feedback
            const btn = document.getElementById("add-to-cart");
            const originalText = btn.textContent;
            btn.textContent = "✓";
            setTimeout(() => {
              btn.textContent = originalText;
            }, 1000);
          }
        } catch (err) {
          console.error("❌ Add to cart failed:", err);
          // Fallback to localStorage
          let cart = JSON.parse(localStorage.getItem("cart")) || [];
          const existing = cart.find((x) => x.id === currentBook._id);
          if (existing) {
            existing.quantity = (existing.quantity || 1) + 1;
          } else {
            cart.push({
              id: currentBook._id,
              title: getLocalized(currentBook.title),
              price: currentBook.price,
              quantity: 1,
            });
          }
          localStorage.setItem("cart", JSON.stringify(cart));
          updateCartCount();
        }
      }

      // Update cart count
      function updateCartCount() {
        const cartCountEl = document.getElementById("cart-count");
        if (!cartCountEl) return;

        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
        cartCountEl.textContent = count;
      }

      // PDF Preview
      async function showPreview() {
        const sampleUrl =
          currentBook.sample_url ||
          currentBook.pdf_sample_url ||
          "/Books/samples/sample.pdf";

        try {
          document.getElementById("pdf-preview").style.display = "block";

          // Load PDF
          const loadingTask = pdfjsLib.getDocument(sampleUrl);
          pdfDoc = await loadingTask.promise;

          // Render first page
          await renderPage(pageNum);
        } catch (err) {
          console.error("❌ PDF load error:", err);
          alert("فشل تحميل معاينة الكتاب. قد لا يكون هناك ملف عينة متاح.");
          document.getElementById("pdf-preview").style.display = "none";
        }
      }

      function renderPage(num) {
        if (pageRendering) {
          pageNumPending = num;
          return;
        }
        pageRendering = true;

        // Get page
        pdfDoc.getPage(num).then(function (page) {
          const viewport = page.getViewport({ scale: scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport,
          };
          const renderTask = page.render(renderContext);

          renderTask.promise.then(function () {
            pageRendering = false;
            if (pageNumPending !== null) {
              renderPage(pageNumPending);
              pageNumPending = null;
            }

            // Update page counter
            document.getElementById("page-num").textContent =
              `${pageNum} / ${pdfDoc.numPages}`;
          });
        });
      }

      function queueRenderPage(num) {
        if (pageNum >= 1 && pageNum <= pdfDoc.numPages) {
          pageNum = num;
          renderPage(pageNum);
        }
      }

      function onPrevPage() {
        if (pageNum > 1) {
          queueRenderPage(pageNum - 1);
        }
      }

      function onNextPage() {
        if (pageNum < pdfDoc.numPages) {
          queueRenderPage(pageNum + 1);
        }
      }

      function closePreview() {
        document.getElementById("pdf-preview").style.display = "none";
        pageNum = 1;
      }

      // Init
      document.addEventListener("DOMContentLoaded", () => {
        applyTranslations();

        // Theme
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
          document.getElementById("sun-icon").style.display = "none";
          document.getElementById("moon-icon").style.display = "inline";
        }

        // Language
        const langToggle = document.getElementById("language-toggle-btn");
        if (langToggle) {
          langToggle.addEventListener("click", () => {
            currentLang = currentLang === "ar" ? "en" : "ar";
            localStorage.setItem("language", currentLang);
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
            langToggle.textContent = currentLang.toUpperCase();
            applyTranslations();
            if (currentBook) renderBook();
          });
        }

        // Event listeners
        document
          .getElementById("add-to-cart")
          ?.addEventListener("click", addToCart);
        document
          .getElementById("preview-btn")
          ?.addEventListener("click", showPreview);
        document
          .getElementById("prev-page")
          ?.addEventListener("click", onPrevPage);
        document
          .getElementById("next-page")
          ?.addEventListener("click", onNextPage);
        document
          .getElementById("close-preview")
          ?.addEventListener("click", closePreview);

        // Load book
        loadBook();
      });
    </script>
  </body>
</html>
