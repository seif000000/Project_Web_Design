<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Book Worms</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .auth-container {
        max-width: 500px;
        margin: 3rem auto;
        padding: 2rem;
        background: var(--card-bg);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .auth-header h1 {
        font-size: 2rem;
        color: var(--text-color);
        margin-bottom: 0.5rem;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .form-group label {
        font-weight: bold;
        color: var(--text-color);
      }
      .form-control {
        padding: 0.75rem;
        border: 1px solid var(--muted);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--text-color);
        font-size: 1rem;
      }
      .form-control:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(106, 175, 235, 0.2);
      }
      .btn-primary {
        padding: 0.8rem;
        background: var(--accent);
        color: var(--dark);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.3s;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
      }
      .auth-footer a:hover {
        text-decoration: underline;
      }
      .error-message {
        background: #ffebee;
        color: #c62828;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }
      .success-message {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }
      @media (max-width: 600px) {
        .auth-container {
          margin: 1rem;
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="../index.html" class="logo-icon">📚</a>
        <span id="site-name">Book Worms</span>
      </div>
      <div class="nav-section nav-center">
        <a href="../Books/books.html" class="nav-link">جميع الكتب</a>
        <a href="../contact/contact.html" class="nav-link">اتصل بنا</a>
        <a href="../about/about-us.html" class="nav-link">من نحن</a>
      </div>
      <div class="nav-section nav-right">
        <button id="language-toggle-btn" class="nav-icon-btn lang-btn">
          AR
        </button>
        <button
          id="theme-toggle"
          class="nav-icon-btn"
          aria-label="Toggle dark mode"
        >
          <span id="sun-icon">☀️</span>
          <span id="moon-icon" style="display: none">🌙</span>
        </button>
        <a href="../Checkout/checkout.html" class="nav-cart-link">
          <button class="nav-icon-btn nav-cart-btn">
            <span class="cart-emoji">🛒</span>
            <span class="cart-count" id="cart-count">0</span>
          </button>
        </a>
        <a href="login.html" class="user-icon">👤</a>
      </div>
    </nav>

    <div class="auth-container">
      <div class="auth-header">
        <h1 id="page-title">تسجيل الدخول</h1>
        <p id="page-desc">مرحبًا بك مجددًا في Book Worms</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username" id="label-username"
            >اسم المستخدم أو البريد</label
          >
          <input type="text" id="username" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="password" id="label-password">كلمة المرور</label>
          <input type="password" id="password" class="form-control" required />
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">
          تسجيل الدخول
        </button>
      </form>

      <div class="auth-footer">
        <p id="no-account">
          ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a>
        </p>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-column">
          <div class="footer-logo">
            <span id="footer-site-name">Book Worms</span>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p id="copyright">حقوق النشر © 2025 Book Worms</p>
      </div>
    </footer>

    <script>
      // ================================
      // Login Page — Backend Integration
      // ================================

      let currentLang = localStorage.getItem("language") || "ar";

      const translations = {
        ar: {
          siteName: "Book Worms",
          pageTitle: "تسجيل الدخول",
          pageDesc: "مرحبًا بك مجددًا في Book Worms",
          labelUsername: "اسم المستخدم أو البريد",
          labelPassword: "كلمة المرور",
          submitBtn: "تسجيل الدخول",
          noAccount: "ليس لديك حساب؟",
          registerLink: "إنشاء حساب",
          usernameRequired: "اسم المستخدم مطلوب",
          passwordRequired: "كلمة المرور مطلوبة",
          loginSuccess: "تم تسجيل الدخول بنجاح!",
          invalidCredentials: "اسم المستخدم أو كلمة المرور غير صحيحة",
          serverError: "حدث خطأ. يُرجى المحاولة لاحقاً.",
          copyright: "حقوق النشر © 2025 Book Worms",
        },
        en: {
          siteName: "Book Worms",
          pageTitle: "Login",
          pageDesc: "Welcome back to Book Worms",
          labelUsername: "Username or Email",
          labelPassword: "Password",
          submitBtn: "Log In",
          noAccount: "Don’t have an account?",
          registerLink: "Create account",
          usernameRequired: "Username is required",
          passwordRequired: "Password is required",
          loginSuccess: "Logged in successfully!",
          invalidCredentials: "Invalid username or password",
          serverError: "An error occurred. Please try again.",
          copyright: "Copyright © 2025 Book Worms",
        },
      };

      function t(key) {
        return translations[currentLang][key] || key;
      }

      function applyTranslations() {
        document.getElementById("site-name").textContent = t("siteName");
        document.getElementById("page-title").textContent = t("pageTitle");
        document.getElementById("page-desc").textContent = t("pageDesc");
        document.getElementById("label-username").textContent =
          t("labelUsername");
        document.getElementById("label-password").textContent =
          t("labelPassword");
        document.getElementById("submit-btn").textContent = t("submitBtn");
        document.getElementById("no-account").innerHTML =
          `${t("noAccount")} <a href="register.html">${t("registerLink")}</a>`;
        document.getElementById("footer-site-name").textContent = t("siteName");
        document.getElementById("copyright").textContent = t("copyright");
      }

      function showError(message) {
        const el = document.getElementById("error-message");
        el.textContent = message;
        el.style.display = "block";
        document.getElementById("success-message").style.display = "none";
      }

      function showSuccess(message) {
        const el = document.getElementById("success-message");
        el.textContent = message;
        el.style.display = "block";
        document.getElementById("error-message").style.display = "none";
      }

      async function login(event) {
        event.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username) return showError(t("usernameRequired"));
        if (!password) return showError(t("passwordRequired"));

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            // ✅ Store token & user
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            showSuccess(t("loginSuccess"));
            setTimeout(() => {
              // Redirect to homepage (where navbar will update)
              window.location.href = "../index.html";
            }, 1500);
          } else {
            showError(data.error || t("invalidCredentials"));
          }
        } catch (err) {
          console.error("❌ Login error:", err);
          showError(t("serverError"));
        }
      }

      // Init
      document.addEventListener("DOMContentLoaded", () => {
        applyTranslations();

        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
          document.getElementById("sun-icon").style.display = "none";
          document.getElementById("moon-icon").style.display = "inline";
        }

        const langToggle = document.getElementById("language-toggle-btn");
        if (langToggle) {
          langToggle.addEventListener("click", () => {
            currentLang = currentLang === "ar" ? "en" : "ar";
            localStorage.setItem("language", currentLang);
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
            langToggle.textContent = currentLang.toUpperCase();
            applyTranslations();
          });
        }

        const form = document.getElementById("login-form");
        if (form) {
          form.addEventListener("submit", login);
        }
      });
    </script>
  </body>
</html>
