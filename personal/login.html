<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title id="page-title">تسجيل الدخول</title>
    <link rel="stylesheet" href="../Books/books.css" />
    <link rel="stylesheet" href="Also-Ahmyd.css" />
</head>

<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-btn">
        <span id="sun-icon">☀️</span>
        <span id="moon-icon" style="display:none;">🌙</span>
    </button>

    <div class="input-carrier">
        <img src="../image/book_image.jpg" alt="Book Image">
        <br><br><br>
        <form id="login-form">
            <label for="email">البريد الالكتروني</label>
            <input type="email" id="email" name="email" placeholder="البريد الالكتروني" required />

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />

            <button type="submit">تسجيل الدخول</button>
        </form>
        
        <p style="margin-top: 1rem;">
            ليس لديك حساب؟ <a href="register.html" style="color: var(--accent);">سجل الآن</a>
        </p>
    </div>

    <script>
// Dark Mode Toggle
const themeToggle = document.getElementById("theme-toggle");
const sunIcon = document.getElementById("sun-icon");
const moonIcon = document.getElementById("moon-icon");
const root = document.documentElement;

// Load saved theme
const savedTheme = localStorage.getItem("theme") || "light";
if (savedTheme === "dark") {
    root.classList.add("dark-mode");
    sunIcon.style.display = "none";
    moonIcon.style.display = "inline";
}

// Toggle theme
themeToggle.addEventListener("click", () => {
    root.classList.toggle("dark-mode");
    const isDark = root.classList.contains("dark-mode");
    
    if (isDark) {
        sunIcon.style.display = "none";
        moonIcon.style.display = "inline";
        localStorage.setItem("theme", "dark");
    } else {
        sunIcon.style.display = "inline";
        moonIcon.style.display = "none";
        localStorage.setItem("theme", "light");
    }
});

// Validation Functions
function validateEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
}

function validatePassword(password) {
    // Password must be at least 8 characters
    return password.length >= 8;
}

function showError(input, message) {
    // Remove any existing error
    const existingError = input.parentElement.querySelector('.error-message');
    if (existingError) {
        existingError.remove();
    }
    
    // Add error styling
    input.style.borderColor = '#ef4444';
    
    // Create and show error message
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.style.color = '#ef4444';
    errorDiv.style.fontSize = '0.875rem';
    errorDiv.style.marginTop = '0.25rem';
    errorDiv.textContent = message;
    input.parentElement.appendChild(errorDiv);
}

function clearError(input) {
    const existingError = input.parentElement.querySelector('.error-message');
    if (existingError) {
        existingError.remove();
    }
    input.style.borderColor = '';
}

// Real-time validation
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

emailInput.addEventListener('blur', () => {
    const email = emailInput.value.trim();
    if (email === '') {
        showError(emailInput, 'البريد الإلكتروني مطلوب');
    } else if (!validateEmail(email)) {
        showError(emailInput, 'من فضلك أدخل بريد إلكتروني صحيح');
    } else {
        clearError(emailInput);
    }
});

emailInput.addEventListener('input', () => {
    if (emailInput.value.trim() !== '') {
        clearError(emailInput);
    }
});

passwordInput.addEventListener('blur', () => {
    const password = passwordInput.value.trim();
    if (password === '') {
        showError(passwordInput, 'كلمة المرور مطلوبة');
    } else if (!validatePassword(password)) {
        showError(passwordInput, 'كلمة المرور يجب أن تكون 8 أحرف على الأقل');
    } else {
        clearError(passwordInput);
    }
});

passwordInput.addEventListener('input', () => {
    if (passwordInput.value.trim() !== '') {
        clearError(passwordInput);
    }
});



// Determine API base URL (supports fallback on localhost/127.0.0.1)
function getApiBaseUrl() {
    if (window.location.port === '5502' || window.location.hostname === '127.0.0.1') {
        return 'http://127.0.0.1:5000/api';
    }
    return 'http://localhost:5000/api';
}

const API_BASE_URL = getApiBaseUrl();
const API_BASE_URL_FALLBACK = window.location.hostname === '127.0.0.1' 
    ? 'http://localhost:5000/api' 
    : 'http://127.0.0.1:5000/api';

// Login Form Submission
document.getElementById("login-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    let isValid = true;

    // Validate email
    if (email === '') {
        showError(emailInput, 'البريد الإلكتروني مطلوب');
        isValid = false;
    } else if (!validateEmail(email)) {
        showError(emailInput, 'من فضلك أدخل بريد إلكتروني صحيح');
        isValid = false;
    } else {
        clearError(emailInput);
    }

    // Validate password
    if (password === '') {
        showError(passwordInput, 'كلمة المرور مطلوبة');
        isValid = false;
    } else if (!validatePassword(password)) {
        showError(passwordInput, 'كلمة المرور يجب أن تكون 8 أحرف على الأقل');
        isValid = false;
    } else {
        clearError(passwordInput);
    }

    if (!isValid) return;

    const payload = { email, password };

    const fetchOptions = {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    };

    try {
        // Try primary API URL
        let response = await fetch(`${API_BASE_URL}/login`, fetchOptions);
        if (!response.ok && response.status !== 401) {
            // try fallback
            response = await fetch(`${API_BASE_URL_FALLBACK}/login`, fetchOptions);
        }

        const result = await response.json();

        if (response.ok && result.success) {
            // store lightweight info for UI; server keeps session cookie
            sessionStorage.setItem('authenticated', 'true');
            sessionStorage.setItem('role', result.user.role);
            sessionStorage.setItem('user_id', result.user.id);
            sessionStorage.setItem('username', result.user.username);

            if (result.user.role === 'admin') {
                window.location.href = '../admin/admin-page.html';
            } else {
                window.location.href = 'profile.html';
            }
            return;
        }

        // show error message
        const message = result && result.message ? result.message : 'فشل تسجيل الدخول';
        showError(passwordInput, message);

    } catch (err) {
        console.error('Login error:', err);
        alert('حدث خطأ في الاتصال بالخادم. تأكد من تشغيل الخادم على http://localhost:5000');
    }
});
    </script>
</body>

</html>
