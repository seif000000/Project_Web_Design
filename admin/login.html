<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول كمسؤول - Book Worms</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .auth-container {
        max-width: 500px;
        margin: 3rem auto;
        padding: 2rem;
        background: var(--card-bg);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .auth-header h1 {
        font-size: 2rem;
        color: var(--text-color);
        margin-bottom: 0.5rem;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .form-group label {
        font-weight: bold;
        color: var(--text-color);
      }
      .form-control {
        padding: 0.75rem;
        border: 1px solid var(--muted);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--text-color);
        font-size: 1rem;
      }
      .btn-primary {
        padding: 0.8rem;
        background: var(--accent);
        color: var(--dark);
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
      }
      .error-message {
        background: #ffebee;
        color: #c62828;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="../index.html" class="logo-icon">📚</a>
        <span id="site-name">Book Worms</span>
      </div>
      <div class="nav-section nav-right">
        <button id="language-toggle-btn" class="nav-icon-btn lang-btn">
          AR
        </button>
        <button id="theme-toggle" class="nav-icon-btn">
          <span id="sun-icon">☀️</span>
          <span id="moon-icon" style="display: none">🌙</span>
        </button>
      </div>
    </nav>

    <div class="auth-container">
      <div class="auth-header">
        <h1>لوحة التحكم للمسؤول</h1>
        <p>تسجيل الدخول باستخدام حساب المسؤول</p>
      </div>

      <div id="error-message" class="error-message"></div>

      <form id="admin-login-form" class="auth-form">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" class="form-control" required />
        </div>
        <button type="submit" class="btn-primary">تسجيل الدخول</button>
      </form>
    </div>

    <script>
      let currentLang = localStorage.getItem("language") || "ar";

      // Translations
      const translations = {
        ar: {
          siteName: "Book Worms",
          error:
            "اسم المستخدم أو كلمة المرور غير صحيحة، أو ليس لديك صلاحية المسؤول",
        },
        en: {
          siteName: "Book Worms",
          error: "Invalid credentials or not an admin",
        },
      };

      function t(key) {
        return translations[currentLang][key] || key;
      }

      function showError(message) {
        const el = document.getElementById("error-message");
        el.textContent = message;
        el.style.display = "block";
      }

      async function adminLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          // Use your existing /api/auth/login
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            if (data.user.role === "admin") {
              // Store admin token + user
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              window.location.href = "admin-page.html";
            } else {
              showError(t("error"));
            }
          } else {
            showError(t("error"));
          }
        } catch (err) {
          showError(t("error"));
        }
      }

      // Init
      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("admin-login-form")
          .addEventListener("submit", adminLogin);

        // Theme
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
          document.getElementById("sun-icon").style.display = "none";
          document.getElementById("moon-icon").style.display = "inline";
        }

        // Lang toggle
        const langToggle = document.getElementById("language-toggle-btn");
        if (langToggle) {
          langToggle.addEventListener("click", () => {
            currentLang = currentLang === "ar" ? "en" : "ar";
            localStorage.setItem("language", currentLang);
            langToggle.textContent = currentLang.toUpperCase();
          });
        }

        document.getElementById("site-name").textContent =
          translations[currentLang].siteName;
      });
    </script>
  </body>
</html>
