<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 إكمال الطلب - Book Worms</title>
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="checkout.css"> 
</head>

<body class="checkout-page">

    <!-- 🔥 زر اللغة أعلى الصفحة -->
    <div style="text-align:center; margin-top:15px;">
        <button id="lang-toggle" class="btn" style="padding:6px 15px; font-weight:bold;">
            EN
        </button>
    </div>

    <div class="container">
        <h2 class="page-title" data-key="titleCheckout">🛒 إكمال طلبك وتفاصيل التوصيل</h2>
        
        <div id="order-summary" class="summary-box">

            <h3 class="box-header" data-key="summaryTitle">ملخص مشترياتك</h3>

            <div id="cart-items-list"></div>

            <div class="summary-total">
                <span data-key="subtotal">الإجمالي الفرعي:</span>
                <span id="subtotal-price" class="total-price">$0.00</span> 
            </div>

            <div class="summary-row shipping-area">
                <label for="governorate-select" data-key="deliveryArea">منطقة التوصيل:</label>
                <select id="governorate-select" aria-label="اختر المحافظة" class="form-control"></select>
            </div>

            <div class="summary-row">
                <span data-key="shippingCost">تكلفة التوصيل:</span>
                <span id="shipping-price">$0.00</span>
            </div>

            <div class="summary-total final-total-row">
                <span data-key="finalTotal">الإجمالي النهائي:</span>
                <span id="final-total" class="total-price">$0.00</span>
            </div>

            <button id="proceed-to-delivery" class="btn final-purchase-btn" style="margin-top: 25px;" data-key="continueBtn">
                متابعة لإدخال بيانات التوصيل
            </button>

        </div>
            
        <div id="delivery-form-container" class="delivery-form-container">
            <h3 class="box-header" data-key="deliveryDetails">إدخال تفاصيل التوصيل</h3>

            <form class="contact-form" id="delivery-form">
                <input type="text" placeholder="الاسم الكامل" data-placeholder-ar="الاسم الكامل" data-placeholder-en="Full Name" required>
                <input type="email" placeholder="البريد الإلكتروني" data-placeholder-ar="البريد الإلكتروني" data-placeholder-en="Email" required>
                <input type="tel" placeholder="رقم الهاتف" data-placeholder-ar="رقم الهاتف" data-placeholder-en="Phone Number" required>
                <textarea placeholder="العنوان بالكامل (المدينة، الحي، الشارع)" 
                    data-placeholder-ar="العنوان بالكامل (المدينة، الحي، الشارع)"
                    data-placeholder-en="Full Address (City, Area, Street)"
                    rows="3" required></textarea>
                
                <button type="submit" class="btn final-purchase-btn" data-key="confirmBtn">
                    تأكيد الطلب والدفع 
                </button>
            </form>
        </div>
    </div>
    
    <script src="../Books/booksData.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
